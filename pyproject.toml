[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "quantile-preserving-timesfm"
version = "0.1.0"
description = "Reproducible FP32 TimesFM 2.5 probabilistic baseline on GIFT-Eval"
requires-python = ">=3.10"
dependencies = [
  "numpy>=1.26,<3",
  "pandas>=2.0,<3",
  "pyarrow>=15,<22",
  "PyYAML>=6.0,<7",
  "matplotlib>=3.8,<4",
]

[project.optional-dependencies]
runtime = [
  "timesfm[torch]==2.0.2",
  "salesforce-gift-eval @ git+https://github.com/SalesforceAIResearch/gift-eval.git@d8184bb51079bb5021332f8e5d7486c378a52202",
  "gluonts==0.15.1",
  "torchao==0.18.0",
  "psutil>=5.9,<8",
]
dev = [
  "pytest>=8,<9",
  "tabulate>=0.9,<1",
]

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = [".", "src"]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py310"
